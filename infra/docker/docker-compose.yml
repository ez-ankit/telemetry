version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  collector-api:
    build: ../../apps/collector-api
    ports:
      - "8081:8081"
    environment:
      COLLECTOR_PORT: 8081
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  worker-consumer:
    build: ../../apps/worker-consumer
    environment:
      KAFKA_BROKER: kafka:9092
      CLICKHOUSE_HOST: clickhouse:9000
    depends_on:
      - kafka
      - clickhouse

  realtime-gateway:
    build: ../../apps/realtime-gateway
    ports:
      - "8082:8082"
    environment:
      REALTIME_PORT: 8082
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

volumes:
  pgdata:
  chdata:
