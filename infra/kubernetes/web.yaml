apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-web
  template:
    metadata:
      labels:
        app: telemetry-web
    spec:
      containers:
        - name: web
          image: telemetry/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-web
spec:
  ports:
    - port: 3000
  selector:
    app: telemetry-web
