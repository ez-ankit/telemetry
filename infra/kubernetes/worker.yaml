apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-worker
  template:
    metadata:
      labels:
        app: telemetry-worker
    spec:
      containers:
        - name: worker
          image: telemetry/worker-consumer:latest
          env:
            - name: KAFKA_BROKER
              value: kafka:9092
            - name: CLICKHOUSE_HOST
              value: clickhouse:9000
